# Siku sync service (production) — signaling + encrypted mailbox
#
# Usage:
#   docker compose -f docker/docker-compose.yml up -d              # bare relay
#   docker compose -f docker/docker-compose.yml --profile tls up -d  # relay + Caddy TLS
#
# Environment overrides (create a .env next to this file):
#   JWT_SECRET=<long random string>   # REQUIRED in production
#   RELAY_DOMAIN=relay.seekpath.com.cn    # for Caddy TLS (tls profile)

services:
  sync-relay:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: siku-sync-relay
    restart: unless-stopped
    ports:
      # 公网流量应走 Caddy 443 (wss)；8080 仅本机/内网调试，不对外暴露。
      - "127.0.0.1:8080:8080"
    environment:
      RELAY_HOST: 0.0.0.0
      RELAY_PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      RELAY_DB_PATH: /data/accounts.json
      RELAY_MAILBOX_DB_PATH: /data/mailbox.sqlite
      # 支付宝电脑网站支付（alipay.trade.page.pay）——三个 ALIPAY_* 缺一即
      # 自动降级为纯线下转账流程。沙箱联调时把 ALIPAY_GATEWAY 换成
      # https://openapi-sandbox.dl.alipaydev.com/gateway.do 并用沙箱密钥。
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY:-}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY:-}
      ALIPAY_GATEWAY: ${ALIPAY_GATEWAY:-}
      # 公网可达的 relay 地址（用于支付宝 notify/return 回调），如
      # https://relay.seekpath.com.cn；不配置则在线支付不可用。
      RELAY_PUBLIC_BASE: ${RELAY_PUBLIC_BASE:-}
    volumes:
      - siku-relay-data:/data

  caddy:
    image: caddy:2-alpine
    container_name: siku-sync-relay-caddy
    restart: unless-stopped
    profiles: [tls]
    ports:
      - "80:80"
      - "443:443"
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:-localhost}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    command: |
      caddy reverse-proxy --from $${RELAY_DOMAIN} --to sync-relay:8080

volumes:
  siku-relay-data:
  caddy-data:
  caddy-config:
