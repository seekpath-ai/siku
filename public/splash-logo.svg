<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="思库 Siku">
  <defs>
    <radialGradient id="splashSpark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB703" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#FB8500" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FB8500" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    @keyframes pulse-core {
      0%, 100% { opacity: 0.85; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.08); }
    }
    .spark-core {
      animation: pulse-core 2.4s ease-in-out infinite;
      transform-origin: 200px 200px;
    }
  </style>

  <!-- 透明背景，由 splashscreen.html 提供底色 -->

  <!-- 四库方块 -->
  <g fill="#22D3EE">
    <rect x="68" y="68" width="122" height="122" rx="26"/>
    <rect x="210" y="68" width="122" height="122" rx="26"/>
    <rect x="68" y="210" width="122" height="122" rx="26"/>
    <rect x="210" y="210" width="122" height="122" rx="26"/>
  </g>

  <!-- 十字分隔：与背景色融合 -->
  <g stroke="#1A1A1E" stroke-width="10" stroke-linecap="round">
    <line x1="200" y1="68" x2="200" y2="332"/>
    <line x1="68" y1="200" x2="332" y2="200"/>
  </g>

  <!-- 中心火花 -->
  <g class="spark-core">
    <circle cx="200" cy="200" r="42" fill="url(#splashSpark)"/>
    <circle cx="200" cy="200" r="20" fill="#FFB703"/>
    <circle cx="200" cy="200" r="8" fill="#FFFFFF" opacity="0.95"/>
  </g>
</svg>
