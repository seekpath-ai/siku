<!doctype html>
<html lang="zh-CN" style="background:#1A1A1E">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>思库</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { background: transparent; }
      html, body {
        width: 100%; height: 100%; overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      .splash {
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        width: 100vw; height: 100vh; color: #F5F5F5;
        position: relative; user-select: none;
        background: #1A1A1E; border-radius: 14px;
      }
      .bg-pulse {
        position: absolute; inset: 0; border-radius: 14px;
        background: radial-gradient(ellipse at 50% 40%, rgba(230,126,34,0.1) 0%, transparent 65%);
        animation: bg-breathe 3s ease-in-out infinite; pointer-events: none;
      }
      @keyframes bg-breathe {
        0%, 100% { opacity: 0.3; }
        50%      { opacity: 0.8; }
      }
      .logo {
        width: 64px;
        height: 64px;
        margin-bottom: 0.7rem;
        filter: drop-shadow(0 0 24px rgba(34, 211, 238, 0.15));
      }
      h1 {
        font-size: 1.35rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        margin: 0 0 0.3rem;
        background: linear-gradient(135deg, #E67E22 0%, #F5A623 60%, #E67E22 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .subtitle {
        color: #9CA3AF;
        font-size: 0.72rem;
        letter-spacing: 0.15em;
        margin-bottom: 1.1rem;
      }
      .loader {
        display: flex; gap: 6px; align-items: center;
      }
      .loader .dot {
        width: 6px; height: 6px; border-radius: 50%;
        background: #E67E22;
        animation: pulse-dot 1.2s ease-in-out infinite;
      }
      .loader .dot:nth-child(2) { animation-delay: 0.15s; }
      .loader .dot:nth-child(3) { animation-delay: 0.3s; }
      @keyframes pulse-dot {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50%      { opacity: 1;   transform: scale(1.3); }
      }
      #status {
        color: #8B8B96;
        font-size: 0.7rem;
        margin-top: 0.8rem;
        min-height: 1.2em;
        letter-spacing: 0.05em;
      }
      .version {
        position: absolute; bottom: 12px;
        color: #5A5A66; font-size: 0.62rem;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <div class="bg-pulse"></div>
      <img src="splash-logo.svg" alt="思库" class="logo" />
      <h1>思 库</h1>
      <p class="subtitle">让灵感涌动</p>
      <div class="loader">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <p id="status">正在初始化...</p>
      <p class="version"></p>
    </div>
    <script type="module">
      try {
        // Build-time injected from tauri.conf.json (see vite.config.ts define).
        document.querySelector('.version').textContent = 'v' + __APP_VERSION__;
      } catch { /* version stays empty */ }
      try {
        const { listen } = await import('@tauri-apps/api/event');
        const statusEl = document.getElementById('status');
        if (statusEl) {
          await listen('splash:phase', (event) => {
            statusEl.textContent = event.payload;
          });
        }
      } catch { /* browser dev — splash stays static */ }
    </script>
  </body>
</html>
