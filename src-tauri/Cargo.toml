[package]
name = "siku"
version = "1.0.4"
description = "思库 - AI-Native 智能体平台，让灵感涌动"
edition = "2021"
rust-version = "1.78"

[lib]
name = "siku_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "siku"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["protocol-asset", "devtools"] }
tauri-plugin-shell = "2.2"
tauri-plugin-dialog = "2.2"
tauri-plugin-fs = "2.2"
tauri-plugin-notification = "2.2"
tauri-plugin-http = "2.2"
tauri-plugin-clipboard-manager = "2.2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"
tokio = { version = "1.42", features = ["full"] }
tokio-util = "0.7"
sqlx = { version = "0.8.2", features = ["sqlite", "runtime-tokio", "time"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
thiserror = "2.0"
async-trait = "0.1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
anyhow = "1.0"
raw-window-handle = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip", "brotli", "deflate"] }
quick-xml = { version = "0.37", features = ["serialize"] }
bytes = "1"
futures = "0.3"
once_cell = "1.20"
pdfium-render = { version = "0.9.2", features = ["image_latest", "thread_safe"] }
lopdf = "0.36.0"
encoding_rs = "0.8"
fastembed = { version = "4.0", optional = true }
walkdir = "2.5"
aes-gcm = "0.10"
rand = "0.8"
tempfile = "3"
notify = "7.0"
zip = { version = "2.2", features = ["aes-crypto"] }
webrtc = "0.12"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
libsqlite3-sys = "0.30"

# macOS-only: window transparency APIs (.transparent()) are gated behind this
# feature. It must stay target-gated — when enabled globally, tauri's build
# script refuses plain `cargo check`/`cargo test` on ALL platforms and demands
# the tauri CLI. Features are additive, so macOS builds get both sets.
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2.1", features = ["macos-private-api"] }

[features]
default = []
onnx = ["fastembed"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
