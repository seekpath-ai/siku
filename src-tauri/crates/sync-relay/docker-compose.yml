# 本地开发最小起：无持久化卷、无 TLS，仅供开发调试。
# 生产部署（持久化 volume + Caddy TLS）请用仓库根目录 docker/docker-compose.yml：
#   docker compose -f docker/docker-compose.yml up -d                # 裸 relay（绑本机回环）
#   docker compose -f docker/docker-compose.yml --profile tls up -d  # relay + Caddy 自动 HTTPS
version: "3.8"

services:
  relay:
    build: .
    ports:
      - "8080:8080"
    environment:
      - RELAY_HOST=0.0.0.0
      - RELAY_PORT=8080
      # ⚠️ PoC 阶段固定密钥；生产环境请务必替换并妥善保管。
      - JWT_SECRET=${JWT_SECRET:-siku-dev-secret-change-me}
      - HEARTBEAT_INTERVAL_SECONDS=30
      - HEARTBEAT_TIMEOUT_SECONDS=120
      - RUST_LOG=info
      # 邮箱库默认紧随账户库（<RELAY_DB_PATH>.mailbox.sqlite）；持久化时需挂卷，
      # 或显式设置 RELAY_MAILBOX_DB_PATH 指向卷内路径。
