version: "3.8"

services:
  relay:
    build: .
    ports:
      - "8080:8080"
    environment:
      - RELAY_HOST=0.0.0.0
      - RELAY_PORT=8080
      # ⚠️ PoC 阶段固定密钥；生产环境请务必替换并妥善保管。
      - JWT_SECRET=${JWT_SECRET:-siku-dev-secret-change-me}
      - HEARTBEAT_INTERVAL_SECONDS=30
      - HEARTBEAT_TIMEOUT_SECONDS=120
      - RUST_LOG=info
